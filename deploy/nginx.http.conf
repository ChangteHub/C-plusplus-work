# Initial configuration used only while obtaining the HTTPS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name swustmarket.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/school-personnel-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "HTTPS is being configured.\n";
    }
}
