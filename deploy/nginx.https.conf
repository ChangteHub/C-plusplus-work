server {
    listen 80;
    listen [::]:80;
    server_name swustmarket.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/school-personnel-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://swustmarket.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name swustmarket.xyz;

    ssl_certificate /etc/letsencrypt/live/swustmarket.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swustmarket.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:schoolTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header Referrer-Policy "same-origin" always;

    access_log /var/log/nginx/school-personnel.access.log;
    error_log /var/log/nginx/school-personnel.error.log;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
